name: Daily LS Stock Supply & Chart Batch Update

on:
  # 매일 밤 21:05 KST (UTC 12:05, 월~금 평일 야간시장 마감 후 자동 실행)
  schedule:
    - cron: '5 12 * * 1-5'
  # GitHub 웹페이지(Actions 탭)에서 언제든 수동 즉시 실행 가능
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (daily: 일일 업데이트 / universe: 분기 시총·유니버스 재산출 / backfill: 2년치 전체 구축 / verify: 4단계 데이터 검증)'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - universe
          - backfill
          - verify
      max_stocks:
        description: '테스트용 최대 처리 종목 수 (0 = 전체 유니버스, 예: 30 입력 시 상위 30종목 1분 내 고속 검증)'
        required: false
        default: '0'
        type: string

jobs:
  update-stock-db:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: LS증권 수급·차트 수집 및 Supabase 업데이트 + 텔레그램 알림 실행
        env:
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rwvvrtjsxzecmdykwrxg.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_vH_-2K-y5HwQ9oqiT1gtIw_P9pKdJ26' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '1018392459' }}
        run: |
          python3 run_daily_screener.py --mode ${{ github.event.inputs.mode || 'daily' }} --max-stocks ${{ github.event.inputs.max_stocks || '0' }}
          python3 run_daily_screener.py --mode verify
