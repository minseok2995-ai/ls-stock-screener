  <script>
    const DEFAULT_SUPABASE_URL = "https://rwvvrtjsxzecmdykwrxg.supabase.co";
    const DEFAULT_SUPABASE_KEY = "sb_publishable_vH_-2K-y5HwQ9oqiT1gtIw_P9pKdJ26";

    const CHART_SELECT_COLS = "shcode,trade_date,open,high,low,close,change_rate,volume,ema_5,ema_20,ema_60,ema_120,ema_240";
    const SUPPLY_SELECT_COLS = [
      "shcode", "trade_date",
      "real_inst_vol", "real_inst_amt", "inst_vol_ratio",
      "frg_vol", "frg_amt", "frg_vol_ratio",
      "ind_vol", "fn_inv_vol", "fn_inv_amt", "etc_corp_vol",
      "itc_vol", "itc_amt", "pef_vol", "pef_amt",
      "pen_vol", "pen_amt", "ins_vol", "ins_amt",
      "etc_fin_vol", "etc_fin_amt", "bank_vol", "bank_amt"
    ].join(",");

    let IS_LIVE_SUPABASE = false;
    let IS_LOADING_DB = false;
    let TOP_TRADE_DATE = "";
    let MASTERS_LIST = [];
    let MASTER_BY_CODE = {};
    let RAW_CHARTS_BY_CODE = {};
    let RAW_SUPPLIES_BY_CODE = {};
    let REVERSAL_HISTORY_LOADED = {};
    let FULL_CHART_LOADED = {};

    let currentMode = "inst_supply";     // "inst_supply" | "trend_reversal"
    let currentInstOpt = "day_10";       // "day_10" | "day_15" | "day_20" | "consec_3d_5"
    let CURRENT_SCREENED_LIST = [];
    let selectedShcode = "";

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getSupabaseHeaders() {
      return {
        "apikey": DEFAULT_SUPABASE_KEY,
        "Authorization": `Bearer ${DEFAULT_SUPABASE_KEY}`,
        "Content-Type": "application/json"
      };
    }

    // 장중 미확정(전 투자주체 수량 0) 더미 행 판별
    function isSettledSupplyRow(s) {
      if (!s) return false;
      return (
        Number(s.real_inst_vol || 0) !== 0 ||
        Number(s.frg_vol || 0) !== 0 ||
        Number(s.ind_vol || 0) !== 0 ||
        Number(s.fn_inv_vol || 0) !== 0 ||
        Number(s.etc_corp_vol || 0) !== 0 ||
        Number(s.itc_vol || 0) !== 0 ||
        Number(s.pef_vol || 0) !== 0 ||
        Number(s.pen_vol || 0) !== 0 ||
        Number(s.ins_vol || 0) !== 0 ||
        Number(s.etc_fin_vol || 0) !== 0 ||
        Number(s.bank_vol || 0) !== 0
      );
    }

    function computeCutoffDateStr(latestDateStr, calendarDaysBack) {
      const parts = String(latestDateStr).split("-").map(Number);
      if (parts.length !== 3 || !parts[0]) return "2026-09-01";
      const dtObj = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
      dtObj.setUTCDate(dtObj.getUTCDate() - calendarDaysBack);
      return dtObj.toISOString().slice(0, 10);
    }

    async function fetchJsonWithRetry(url, headers, maxRetries = 2) {
      let lastErr = null;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          const resp = await fetch(url, { headers });
          if (!resp.ok) {
            throw new Error(`HTTP ${resp.status}`);
          }
          return await resp.json();
        } catch (err) {
          lastErr = err;
          if (attempt < maxRetries) {
            await new Promise(res => setTimeout(res, 350 * (attempt + 1)));
          }
        }
      }
      throw lastErr || new Error("Network request failed");
    }

    async function runWithConcurrency(taskFns, concurrency = 8, onProgress = null) {
      const results = new Array(taskFns.length);
      let nextIdx = 0;
      let completed = 0;

      async function worker() {
        while (true) {
          const idx = nextIdx++;
          if (idx >= taskFns.length) break;
          results[idx] = await taskFns[idx]();
          completed++;
          if (onProgress) onProgress(completed, taskFns.length);
        }
      }

      const workers = [];
      const workerCount = Math.min(concurrency, taskFns.length);
      for (let w = 0; w < workerCount; w++) {
        workers.push(worker());
      }
      await Promise.all(workers);
      return results;
    }

    function mergeSortedByTradeDate(existingRows, newRows, maxDate) {
      const byDate = {};
      (existingRows || []).forEach(r => {
        if (r && r.trade_date && (!maxDate || r.trade_date <= maxDate)) {
          byDate[r.trade_date] = r;
        }
      });
      (newRows || []).forEach(r => {
        if (r && r.trade_date && (!maxDate || r.trade_date <= maxDate)) {
          byDate[r.trade_date] = r;
        }
      });
      return Object.values(byDate).sort((a, b) => String(a.trade_date).localeCompare(String(b.trade_date)));
    }

    // =========================================================================
    // Strategy v2.0 수식 검증 함수 (STRATEGY.md 2.1 ~ 2.3 단일 진실 공급원)
    // =========================================================================

    // 기준일 T부터 역순으로 일별 inst_vol_ratio >= 5.0% 연속 발생 일수 산출
    function computeConsec5pDays(sList) {
      let cnt = 0;
      for (let i = sList.length - 1; i >= 0; i--) {
        if (Number(sList[i].inst_vol_ratio) >= 5.0) {
          cnt++;
        } else {
          break;
        }
      }
      return cnt;
    }

    // 2.3절 ② 당일 첫 순수기관 수급 발생 조건 (유형 A 또는 유형 B)
    function evaluateFirstInstSupplyTypes(sList) {
      const sN = sList.length;
      const sIdx = sN - 1;
      let isTypeA = false;
      let isTypeB = false;

      // [유형 A]: 당일(T) >= 10.0% AND 직전 10거래일(T-10 ~ T-1) 모두 < 5.0%
      if (sN >= 11 && Number(sList[sIdx].inst_vol_ratio) >= 10.0) {
        let prior10Quiet = true;
        for (let k = 1; k <= 10; k++) {
          if (!(Number(sList[sIdx - k].inst_vol_ratio) < 5.0)) {
            prior10Quiet = false;
            break;
          }
        }
        isTypeA = prior10Quiet;
      }

      // [유형 B]: 최근 3거래일(T-2, T-1, T) 모두 >= 5.0% AND 그 직전 10거래일(T-12 ~ T-3) 모두 < 5.0%
      if (sN >= 13) {
        const recent3Active =
          Number(sList[sIdx].inst_vol_ratio) >= 5.0 &&
          Number(sList[sIdx - 1].inst_vol_ratio) >= 5.0 &&
          Number(sList[sIdx - 2].inst_vol_ratio) >= 5.0;
        if (recent3Active) {
          let prior10QuietB = true;
          for (let m = 3; m <= 12; m++) {
            if (!(Number(sList[sIdx - m].inst_vol_ratio) < 5.0)) {
              prior10QuietB = false;
              break;
            }
          }
          isTypeB = prior10QuietB;
        }
      }

      return { isTypeA, isTypeB };
    }

    // 2.3절 ①-(2) 기준점 P에서의 60거래일 낙폭 과대(-15.0% 이하) 및 바닥 진정 판정
    function checkStabilizationAtP(cList, pIdx) {
      if (pIdx < 59 || pIdx >= cList.length) return false;

      // (a) 기준점 P 포함 직전 60거래일(P-59 ~ P) 장중 최고가 대비 P 종가 하락률 <= -15.0%
      let maxHigh60 = -Infinity;
      for (let k = 0; k <= 59; k++) {
        const h = Number(cList[pIdx - k].high);
        if (h > maxHigh60) maxHigh60 = h;
      }
      if (!(maxHigh60 > 0)) return false;
      const closeP = Number(cList[pIdx].close);
      const drawdownPct = ((closeP / maxHigh60) - 1.0) * 100.0;
      if (!(drawdownPct <= -15.0)) return false;

      // (b) 직전 20거래일 최저가 미이탈: min(Close_{P-2}, Close_{P-1}, Close_P) >= min_{k=3..19} Low_{P-k}
      const closePm1 = Number(cList[pIdx - 1].close);
      const closePm2 = Number(cList[pIdx - 2].close);
      const minClose3 = Math.min(closePm2, closePm1, closeP);
      let minLow17 = Infinity;
      for (let k = 3; k <= 19; k++) {
        const l = Number(cList[pIdx - k].low);
        if (l < minLow17) minLow17 = l;
      }
      if (!(minClose3 >= minLow17)) return false;

      // (c) 3거래일 연속 저점 지지: Close_{P-2} >= Low_{P-3} AND Close_{P-1} >= Low_{P-2} AND Close_P >= Low_{P-1}
      const lowPm3 = Number(cList[pIdx - 3].low);
      const lowPm2 = Number(cList[pIdx - 2].low);
      const lowPm1 = Number(cList[pIdx - 1].low);
      if (!(closePm2 >= lowPm3 && closePm1 >= lowPm2 && closeP >= lowPm1)) {
        return false;
      }

      return true;
    }

    // 45일 초기 윈도우만으로 판별 가능한 [하락 추세 전환 수급 발생] 1차 후보 추출 (3.5절 3항)
    function getStage1ReversalCandidateCodes() {
      if (!TOP_TRADE_DATE) return [];
      const candidates = [];
      for (const m of MASTERS_LIST) {
        const code = m.shcode;
        const cList = (RAW_CHARTS_BY_CODE[code] || []).filter(c => c.trade_date <= TOP_TRADE_DATE);
        const sList = (RAW_SUPPLIES_BY_CODE[code] || []).filter(
          s => s.trade_date < TOP_TRADE_DATE || (s.trade_date === TOP_TRADE_DATE && isSettledSupplyRow(s))
        );
        if (cList.length < 2 || sList.length < 13) continue;

        const chartT = cList[cList.length - 1];
        const supplyT = sList[sList.length - 1];
        if (chartT.trade_date !== TOP_TRADE_DATE || supplyT.trade_date !== TOP_TRADE_DATE) continue;

        // ③ 당일 종가 >= EMA5 AND 당일 양봉(종가 > 시가)
        if (!(Number(chartT.close) >= Number(chartT.ema_5) && Number(chartT.close) > Number(chartT.open))) {
          continue;
        }

        // ①-(1) 직전 거래일(T-1) 중장기 이평선 역배열: EMA20 < EMA60 < EMA120
        const chartTm1 = cList[cList.length - 2];
        const e20 = Number(chartTm1.ema_20);
        const e60 = Number(chartTm1.ema_60);
        const e120 = Number(chartTm1.ema_120);
        if (!(e20 > 0 && e60 > 0 && e120 > 0 && e20 < e60 && e60 < e120)) {
          continue;
        }

        // ② 당일 첫 순수기관 수급 발생 (유형 A 또는 유형 B)
        const { isTypeA, isTypeB } = evaluateFirstInstSupplyTypes(sList);
        if (isTypeA || isTypeB) {
          candidates.push(code);
        }
      }
      return candidates;
    }

    // 1차 후보 종목들의 125일(약 80~88영업일) 일봉 히스토리를 10종목 이하 PK 청크로 보강 로드
    async function ensureReversalCandidatesHistory() {
      const stage1Codes = getStage1ReversalCandidateCodes();
      const missingCodes = stage1Codes.filter(code => !REVERSAL_HISTORY_LOADED[code]);
      if (!missingCodes.length || !TOP_TRADE_DATE) return;

      const headers = getSupabaseHeaders();
      const cutoff125 = computeCutoffDateStr(TOP_TRADE_DATE, 125);
      const chunks10 = [];
      for (let i = 0; i < missingCodes.length; i += 10) {
        chunks10.push(missingCodes.slice(i, i + 10));
      }

      const tasks = chunks10.map(chunk => async () => {
        const inList = chunk.join(",");
        const url =
          `${DEFAULT_SUPABASE_URL}/rest/v1/daily_chart` +
          `?shcode=in.(${inList})` +
          `&and=(trade_date.gte.${cutoff125},trade_date.lte.${TOP_TRADE_DATE})` +
          `&select=${CHART_SELECT_COLS}` +
          `&order=shcode.asc,trade_date.asc&limit=1000`;
        try {
          const rows = await fetchJsonWithRetry(url, headers, 2);
          return { ok: true, chunk, rows: Array.isArray(rows) ? rows : [] };
        } catch (err) {
          console.warn("후보 종목 125일 차트 보강 조회 실패:", err);
          return { ok: false, chunk, rows: [] };
        }
      });

      const chunkResults = await runWithConcurrency(tasks, 6);
      chunkResults.forEach(res => {
        if (!res || !res.ok) return;
        const grouped = {};
        res.rows.forEach(r => {
          if (!r || !r.shcode) return;
          if (!grouped[r.shcode]) grouped[r.shcode] = [];
          grouped[r.shcode].push(r);
        });
        res.chunk.forEach(code => {
          if (grouped[code] && grouped[code].length > 0) {
            RAW_CHARTS_BY_CODE[code] = mergeSortedByTradeDate(
              RAW_CHARTS_BY_CODE[code],
              grouped[code],
              TOP_TRADE_DATE
            );
          }
          REVERSAL_HISTORY_LOADED[code] = true;
        });
      });
    }

    // 개별 종목에 대한 Strategy v2.0 평가 객체 생성 (기준일 T 정합성 엄수)
    function buildEvaluatedStockItem(m) {
      const code = m.shcode;
      const cList = (RAW_CHARTS_BY_CODE[code] || []).filter(c => c.trade_date <= TOP_TRADE_DATE);
      const sList = (RAW_SUPPLIES_BY_CODE[code] || []).filter(
        s => s.trade_date < TOP_TRADE_DATE || (s.trade_date === TOP_TRADE_DATE && isSettledSupplyRow(s))
      );
      if (!cList.length || !sList.length) return null;

      const chartT = cList[cList.length - 1];
      const supplyT = sList[sList.length - 1];

      // 2.1절 1항: 확정 수급과 일봉 모두 기준일 T(trade_date === T) 레코드가 존재하는 종목만 대상
      if (chartT.trade_date !== TOP_TRADE_DATE || supplyT.trade_date !== TOP_TRADE_DATE || !isSettledSupplyRow(supplyT)) {
        return null;
      }

      // 2.1절 2~5항: DB 확정 저장된 inst_vol_ratio, frg_vol_ratio 단일 진실 공급원 사용
      const instRatioT = Number(supplyT.inst_vol_ratio || 0);
      const frgRatioT = Number(supplyT.frg_vol_ratio || 0);
      const instAmtM_T = Number(supplyT.real_inst_amt || 0);
      const consec5pDays = computeConsec5pDays(sList);

      const closeT = Number(chartT.close || 0);
      const prevClose = cList.length >= 2 ? Number(cList[cList.length - 2].close) : null;
      const priceDiff = (prevClose !== null && Number.isFinite(prevClose)) ? (closeT - prevClose) : 0;
      const changeRate = Number.isFinite(Number(chartT.change_rate)) ? Number(chartT.change_rate) : 0;

      // [모드 2: 하락 추세 전환 수급 발생] 판정 (최소 65거래일 일봉 & 13거래일 수급)
      let isTrendReversal = false;
      if (cList.length >= 65 && sList.length >= 13) {
        const tIdx = cList.length - 1;
        const chartTm1 = cList[tIdx - 1];
        const bullishAboveEma5 = closeT >= Number(chartT.ema_5) && closeT > Number(chartT.open);
        const e20 = Number(chartTm1.ema_20);
        const e60 = Number(chartTm1.ema_60);
        const e120 = Number(chartTm1.ema_120);
        const reverseAlignedTm1 = e20 > 0 && e60 > 0 && e120 > 0 && e20 < e60 && e60 < e120;

        if (bullishAboveEma5 && reverseAlignedTm1) {
          const { isTypeA, isTypeB } = evaluateFirstInstSupplyTypes(sList);
          const validViaTypeA = isTypeA && checkStabilizationAtP(cList, tIdx - 1);
          const validViaTypeB = isTypeB && (
            checkStabilizationAtP(cList, tIdx - 1) ||
            checkStabilizationAtP(cList, tIdx - 3)
          );
          isTrendReversal = validViaTypeA || validViaTypeB;
        }
      }

      // [모드 1: 3일 연속 5% 이상] 판정 (T-2, T-1, T 각각 >= 5.0%)
      const isConsec3d5p =
        sList.length >= 3 &&
        Number(sList[sList.length - 3].inst_vol_ratio) >= 5.0 &&
        Number(sList[sList.length - 2].inst_vol_ratio) >= 5.0 &&
        Number(sList[sList.length - 1].inst_vol_ratio) >= 5.0;

      return {
        shcode: String(code),
        hname: m.hname,
        market: m.market,
        mcap_eok: Number(m.market_cap_eok || 0),
        val20_eok: Number(m.avg_val_20d_eok || 0),
        trade_date: TOP_TRADE_DATE,
        open: Number(chartT.open || 0),
        high: Number(chartT.high || 0),
        low: Number(chartT.low || 0),
        close: closeT,
        priceDiff,
        change_rate: changeRate,
        ema_5: Number(chartT.ema_5 || closeT),
        ema_20: Number(chartT.ema_20 || closeT),
        ema_60: Number(chartT.ema_60 || closeT),
        ema_120: Number(chartT.ema_120 || closeT),
        ema_240: Number(chartT.ema_240 || closeT),
        instRatioT,
        instAmtM_T,
        frgRatioT,
        consec5pDays,
        isConsec3d5p,
        isTrendReversal,
        supplyT
      };
    }

    // UI 제어 및 테이블 렌더링

    async function onModeChange() {
      const modeSelect = document.getElementById("filterMode");
      currentMode = modeSelect.value;
      const subWrap = document.getElementById("instSubOptionsWrap");

      if (currentMode === "inst_supply") {
        subWrap.classList.remove("hidden");
      } else {
        subWrap.classList.add("hidden");
        if (IS_LIVE_SUPABASE) {
          await ensureReversalCandidatesHistory();
        }
      }
      applyScreening();
    }

    function setInstSubOption(optKey) {
      currentInstOpt = optKey;
      document.querySelectorAll(".inst-opt-btn").forEach(btn => {
        const key = btn.getAttribute("data-subopt");
        if (key === currentInstOpt) {
          btn.className = "inst-opt-btn py-2 px-2.5 rounded-lg text-xs font-semibold border border-emerald-500/50 bg-emerald-500 text-slate-950 transition";
        } else {
          btn.className = "inst-opt-btn py-2 px-2.5 rounded-lg text-xs font-semibold border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] hover:bg-[var(--secondary)] transition";
        }
      });
      applyScreening();
    }

    function applyScreening() {
      const tbody = document.getElementById("screenerTableBody");
      const countBadge = document.getElementById("resultCountBadge");

      if (!IS_LIVE_SUPABASE || !TOP_TRADE_DATE) {
        CURRENT_SCREENED_LIST = [];
        countBadge.textContent = "0종목";
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-10 text-center text-xs text-[var(--muted-foreground)]">
              ${IS_LOADING_DB ? "실시간 수급·차트 데이터를 불러오는 중입니다..." : "표시할 수급 데이터가 없습니다."}
            </td>
          </tr>`;
        return;
      }

      const evaluatedAll = [];
      for (const m of MASTERS_LIST) {
        const item = buildEvaluatedStockItem(m);
        if (item) evaluatedAll.push(item);
      }

      const filtered = evaluatedAll.filter(item => {
        if (currentMode === "inst_supply") {
          if (currentInstOpt === "day_10") return item.instRatioT >= 10.0;
          if (currentInstOpt === "day_15") return item.instRatioT >= 15.0;
          if (currentInstOpt === "day_20") return item.instRatioT >= 20.0;
          if (currentInstOpt === "consec_3d_5") return item.isConsec3d5p;
          return item.instRatioT >= 10.0;
        }
        if (currentMode === "trend_reversal") {
          return item.isTrendReversal;
        }
        return false;
      });

      // 2.1절 3항 & 3.3절 2항: 마지막 날(기준일 T) 당일 inst_vol_ratio 내림차순 정렬 (동률 시 real_inst_amt 내림차순)
      filtered.sort((a, b) => {
        if (b.instRatioT !== a.instRatioT) return b.instRatioT - a.instRatioT;
        if (b.instAmtM_T !== a.instAmtM_T) return b.instAmtM_T - a.instAmtM_T;
        return a.shcode.localeCompare(b.shcode);
      });

      CURRENT_SCREENED_LIST = filtered;
      countBadge.textContent = `${filtered.length.toLocaleString()}종목`;

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-10 text-center text-xs text-[var(--muted-foreground)]">
              기준일(${escapeHtml(TOP_TRADE_DATE)})에 선택한 조건을 충족하는 종목이 없습니다.
            </td>
          </tr>`;
        // 조건 충족 종목이 0건이어도 기존 우측 상세 패널에 표시할 기본 종목 유지
        if (!selectedShcode && evaluatedAll.length > 0) {
          selectedShcode = evaluatedAll[0].shcode;
        }
        if (selectedShcode) renderStockDetail(selectedShcode);
        return;
      }

      if (!filtered.some(e => e.shcode === selectedShcode)) {
        selectedShcode = filtered[0].shcode;
      }

      tbody.innerHTML = filtered.map(item => {
        const isSelected = item.shcode === selectedShcode;
        const chgRate = Number(item.change_rate || 0);
        const chgColor = chgRate > 0 ? "text-emerald-400" : (chgRate < 0 ? "text-rose-400" : "text-[var(--muted-foreground)]");
        const chgSign = chgRate > 0 ? "+" : "";

        const amtEokNum = Number(item.instAmtM_T || 0) / 100.0;
        const amtSign = amtEokNum > 0 ? "+" : "";
        const amtColor = amtEokNum >= 0 ? "text-[var(--foreground)]" : "text-rose-400";

        const frgVal = Number(item.frgRatioT || 0);
        const frgSign = frgVal > 0 ? "+" : "";
        const frgColor = frgVal > 0 ? "text-sky-400" : (frgVal < 0 ? "text-rose-400" : "text-[var(--muted-foreground)]");

        const consecClass = item.consec5pDays >= 3
          ? "text-amber-400 font-semibold"
          : "text-[var(--muted-foreground)]";

        return `
          <tr data-shcode="${escapeHtml(item.shcode)}" onclick="selectStock('${escapeHtml(item.shcode)}')"
              class="screener-row cursor-pointer transition hover:bg-[var(--secondary)] whitespace-nowrap ${isSelected ? 'bg-[var(--secondary)]' : ''}">
            <td class="py-1.5 px-3 font-semibold text-[var(--foreground)]">${escapeHtml(item.hname)}</td>
            <td class="py-1.5 px-2.5 text-right font-mono">${Number(item.close).toLocaleString()}</td>
            <td class="py-1.5 px-2.5 text-right font-mono font-medium ${chgColor}">${chgSign}${chgRate.toFixed(2)}%</td>
            <td class="py-1.5 px-2.5 text-right font-mono font-bold text-emerald-400">${item.instRatioT.toFixed(1)}%</td>
            <td class="py-1.5 px-2.5 text-right font-mono ${amtColor}">${amtSign}${amtEokNum.toFixed(1)}억</td>
            <td class="py-1.5 px-2.5 text-right font-mono ${frgColor}">${frgSign}${frgVal.toFixed(1)}%</td>
            <td class="py-1.5 px-2.5 text-center font-mono ${consecClass}">${item.consec5pDays}일</td>
          </tr>
        `;
      }).join("");

      renderStockDetail(selectedShcode);
    }

    function selectStock(shcode) {
      selectedShcode = shcode;
      document.querySelectorAll(".screener-row").forEach(tr => {
        if (tr.getAttribute("data-shcode") === shcode) {
          tr.classList.add("bg-[var(--secondary)]");
        } else {
          tr.classList.remove("bg-[var(--secondary)]");
        }
      });
      renderStockDetail(shcode);
    }

    // =========================================================================
    // [엑셀 저장] 다운로드 (STRATEGY.md 3.3절 3항 규격)
    // =========================================================================

    function formatDiffAndRate(diff, rate) {
      const safeDiff = Number.isFinite(Number(diff)) ? Math.round(Number(diff)) : 0;
      const safeRate = Number.isFinite(Number(rate)) ? Number(rate) : 0;
      const dSign = safeDiff > 0 ? "+" : "";
      const rSign = safeRate > 0 ? "+" : "";
      return `${dSign}${safeDiff.toLocaleString()} (${rSign}${safeRate.toFixed(2)}%)`;
    }

    function getExcelExportFilename() {
      const refDate = TOP_TRADE_DATE || new Date().toISOString().slice(0, 10);
      if (currentMode === "trend_reversal") {
        return `${refDate}_하락추세전환수급발생.xlsx`;
      }
      if (currentInstOpt === "day_15") {
        return `${refDate}_기관수급발생_당일15%이상.xlsx`;
      }
      if (currentInstOpt === "day_20") {
        return `${refDate}_기관수급발생_당일20%이상.xlsx`;
      }
      if (currentInstOpt === "consec_3d_5") {
        return `${refDate}_기관수급발생_3일연속5%이상.xlsx`;
      }
      return `${refDate}_기관수급발생_당일10%이상.xlsx`;
    }

    function exportScreenedToExcel() {
      if (typeof XLSX === "undefined") {
        alert("엑셀 생성 라이브러리를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      const headers = [
        "종목코드", "종목명", "현재가", "등락폭/율",
        "수급 비중", "수급 금액",
        "Ema5", "Ema20", "Ema60", "Ema120", "Ema240"
      ];

      const aoa = [headers];
      CURRENT_SCREENED_LIST.forEach(item => {
        const amtEokNum = Number(item.instAmtM_T || 0) / 100.0;
        const amtSign = amtEokNum > 0 ? "+" : "";
        aoa.push([
          { t: "s", v: String(item.shcode).padStart(6, "0") },
          { t: "s", v: String(item.hname || "") },
          { t: "n", v: Number(item.close || 0) },
          { t: "s", v: formatDiffAndRate(item.priceDiff, item.change_rate) },
          { t: "s", v: `${Number(item.instRatioT || 0).toFixed(1)}%` },
          { t: "s", v: `${amtSign}${amtEokNum.toFixed(1)}억` },
          { t: "n", v: Number(Number(item.ema_5 || 0).toFixed(2)) },
          { t: "n", v: Number(Number(item.ema_20 || 0).toFixed(2)) },
          { t: "n", v: Number(Number(item.ema_60 || 0).toFixed(2)) },
          { t: "n", v: Number(Number(item.ema_120 || 0).toFixed(2)) },
          { t: "n", v: Number(Number(item.ema_240 || 0).toFixed(2)) }
        ]);
      });

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = [
        { wch: 10 }, { wch: 18 }, { wch: 12 }, { wch: 20 },
        { wch: 11 }, { wch: 13 },
        { wch: 11 }, { wch: 11 }, { wch: 11 }, { wch: 11 }, { wch: 11 }
      ];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "스크리닝결과");
      XLSX.writeFile(wb, getExcelExportFilename());
    }

    // 우측 종목 상세 패널 & 캔들·EMA 차트 (STRATEGY.md 3.4절)

    function renderStockDetail(shcode) {

      if (!item && MASTER_BY_CODE[shcode]) {
        item = buildEvaluatedStockItem(MASTER_BY_CODE[shcode]);
      }

      const p = item.supplyT || {};

      document.getElementById("detailMarket").textContent = item.market;
      document.getElementById("detailCode").textContent = item.shcode;
      document.getElementById("detailMcap").textContent =
        `시총 ${Number(item.mcap_eok).toLocaleString()}억 · 20일평균 ${Number(item.val20_eok).toLocaleString()}억`;
      document.getElementById("detailName").textContent = item.hname;
      document.getElementById("detailPrice").textContent = `${Number(item.close).toLocaleString()}원`;

      const chgEl = document.getElementById("detailChange");
      const chgRate = Number(item.change_rate || 0);
      chgEl.textContent = `${chgRate > 0 ? '+' : ''}${chgRate.toFixed(2)}%`;
      chgEl.className = `text-xs font-semibold ${chgRate > 0 ? 'text-emerald-400' : (chgRate < 0 ? 'text-rose-400' : 'text-[var(--muted-foreground)]')}`;

      document.getElementById("emaVal5").textContent = Math.round(Number(item.ema_5)).toLocaleString();
      document.getElementById("emaVal20").textContent = Math.round(Number(item.ema_20)).toLocaleString();
      document.getElementById("emaVal60").textContent = Math.round(Number(item.ema_60)).toLocaleString();
      document.getElementById("emaVal120").textContent = Math.round(Number(item.ema_120)).toLocaleString();
      document.getElementById("emaVal240").textContent = Math.round(Number(item.ema_240)).toLocaleString();

      document.getElementById("detailPeriodLabel").textContent = "당일 1일";
      document.getElementById("detailInstRatioBadge").textContent =
        `거래량 대비 순수기관 ${Number(item.instRatioT || 0).toFixed(1)}%`;

      const subjects = [
        { label: "투신 (순수기관 포함)", amt: p.itc_amt, vol: p.itc_vol, color: "bg-emerald-500" },
        { label: "연기금 (순수기관 포함)", amt: p.pen_amt, vol: p.pen_vol, color: "bg-emerald-500" },
        { label: "사모펀드 (순수기관 포함)", amt: p.pef_amt, vol: p.pef_vol, color: "bg-emerald-500" },
        { label: "보험 (순수기관 포함)", amt: p.ins_amt, vol: p.ins_vol, color: "bg-emerald-500" },
        { label: "기타금융 (순수기관 포함)", amt: p.etc_fin_amt, vol: p.etc_fin_vol, color: "bg-emerald-500" },
        { label: "은행 (순수기관 포함)", amt: p.bank_amt, vol: p.bank_vol, color: "bg-emerald-500" },
        { label: "외국인 (별도 집계)", amt: p.frg_amt, vol: p.frg_vol, color: "bg-sky-500" },
        { label: "금융투자 (순수기관 합산에서 제외됨)", amt: p.fn_inv_amt, vol: p.fn_inv_vol, color: "bg-rose-500" }
      ];

      const maxAmt = Math.max(...subjects.map(s => Math.abs(Number(s.amt || 0))), 1);
      document.getElementById("subjectBreakdownContainer").innerHTML = subjects.map(s => {
        const eok = (Number(s.amt || 0) / 100).toFixed(1);
        const w = Math.min(100, Math.max(4, (Math.abs(Number(s.amt || 0)) / maxAmt) * 100));
        const sign = Number(s.amt || 0) > 0 ? "+" : "";
        const vSign = Number(s.vol || 0) > 0 ? "+" : "";
        return `
          <div class="space-y-1">
            <div class="flex justify-between text-xs">
              <span class="text-[var(--muted-foreground)]">${s.label}</span>
              <span class="font-mono font-semibold ${Number(s.amt || 0) >= 0 ? 'text-[var(--foreground)]' : 'text-rose-400'}">
                ${sign}${eok}억 (${vSign}${Number(s.vol || 0).toLocaleString()}주)
              </span>
            </div>
            <div class="w-full h-1.5 bg-[var(--background)] rounded-full overflow-hidden border border-[var(--border)]">
              <div class="h-full ${s.color} rounded-full" style="width:${w}%"></div>
            </div>
          </div>
        `;
      }).join("");

      drawCandlestickAndEmaChart(item);
      if (IS_LIVE_SUPABASE && !FULL_CHART_LOADED[item.shcode]) {
        ensureStockFullChart(item);
      }
    }

    async function ensureStockFullChart(stock) {
      if (!TOP_TRADE_DATE) return;
      FULL_CHART_LOADED[stock.shcode] = true;
      try {
        const headers = getSupabaseHeaders();
        const url =
          `${DEFAULT_SUPABASE_URL}/rest/v1/daily_chart` +
          `?shcode=eq.${stock.shcode}` +
          `&trade_date=lte.${TOP_TRADE_DATE}` +
          `&select=${CHART_SELECT_COLS}` +
          `&order=trade_date.desc&limit=240`;
        const rows = await fetchJsonWithRetry(url, headers, 1);
        if (Array.isArray(rows) && rows.length >= 5) {
          RAW_CHARTS_BY_CODE[stock.shcode] = mergeSortedByTradeDate(
            RAW_CHARTS_BY_CODE[stock.shcode],
            rows,
            TOP_TRADE_DATE
          );
          if (selectedShcode === stock.shcode) {
            drawCandlestickAndEmaChart(stock);
          }
        }
      } catch (e) {
        console.warn("개별 종목 일봉 상세 조회 실패:", e);
      }
    }

    function drawCandlestickAndEmaChart(stock) {
      const canvas = document.getElementById("candleChartCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      const gridColor = "rgba(255,255,255,0.08)";
      const textColor = "#94a3b8";

      const realChartRows = (RAW_CHARTS_BY_CODE[stock.shcode] || []).filter(
        r => !TOP_TRADE_DATE || r.trade_date <= TOP_TRADE_DATE
      );
      if (!realChartRows.length) return;

      const sliced = realChartRows.slice(-60);
      document.getElementById("chartCandleCountLabel").textContent =
        `실제 수정주가 일봉 (표시 ${sliced.length}영업일 / 보유 ${realChartRows.length}영업일 · ${sliced[sliced.length - 1].trade_date})`;

      const candles = sliced.map(r => ({
        o: Number(r.open),
        h: Number(r.high),
        l: Number(r.low),
        c: Number(r.close)
      }));
      const ema5 = sliced.map(r => Number(r.ema_5 || r.close));
      const ema20 = sliced.map(r => Number(r.ema_20 || r.close));
      const ema60 = sliced.map(r => Number(r.ema_60 || r.close));
      const ema120 = sliced.map(r => Number(r.ema_120 || r.close));
      const ema240 = sliced.map(r => Number(r.ema_240 || r.close));

      const count = candles.length;
      const allVals = [
        ...candles.flatMap(d => [d.h, d.l]),
        ...ema5, ...ema20, ...ema60, ...ema120, ...ema240
      ].filter(v => v > 0);
      if (!allVals.length) return;

      const minP = Math.min(...allVals) * 0.992;
      const maxP = Math.max(...allVals) * 1.008;

      const padL = 12, padR = 62, padT = 14, padB = 18;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const toY = p => padT + plotH - ((p - minP) / Math.max(1, maxP - minP)) * plotH;
      const toX = idx => padL + (idx + 0.5) * (plotW / count);

      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      ctx.font = "11px monospace";
      ctx.fillStyle = textColor;
      for (let g = 0; g <= 3; g++) {
        const py = padT + (plotH / 3) * g;
        const pVal = Math.round(maxP - ((maxP - minP) / 3) * g);
        ctx.beginPath();
        ctx.moveTo(padL, py);
        ctx.lineTo(W - padR, py);
        ctx.stroke();
        ctx.fillText(pVal.toLocaleString(), W - padR + 4, py + 4);
      }

      const barW = Math.max(3, (plotW / count) * 0.58);
      candles.forEach((d, idx) => {
        const x = toX(idx);
        const isUp = d.c >= d.o;
        ctx.strokeStyle = isUp ? "#10b981" : "#f43f5e";
        ctx.fillStyle = isUp ? "#10b981" : "#f43f5e";
        ctx.beginPath();
        ctx.moveTo(x, toY(d.h));
        ctx.lineTo(x, toY(d.l));
        ctx.stroke();

        const topY = toY(Math.max(d.o, d.c));
        const botY = toY(Math.min(d.o, d.c));
        ctx.fillRect(x - barW / 2, topY, barW, Math.max(2, botY - topY));
      });

      function drawLine(arr, color, width) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        arr.forEach((v, idx) => {
          const x = toX(idx);
          const y = toY(v);
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }

      drawLine(ema240, "#f43f5e", 1.2);
      drawLine(ema120, "#f97316", 1.2);
      drawLine(ema60, "#0ea5e9", 1.4);
      drawLine(ema20, "#10b981", 2.0);
      drawLine(ema5, "#f59e0b", 1.5);
    }

    // =========================================================================
    // 대용량 DB(70만 행) PK 인덱스 기반 고속 병렬 로드 (STRATEGY.md 3.5절 & 4.5절)
    // =========================================================================

    const REPRESENTATIVE_DATE_SHCODES = "005930,000660,005380,012450,196170,006650,023160,218410,166090,009420";

    async function fetchLatestSettledTradeDate(headers) {
      // 시가총액 상·중·하위 분산 대표 10종목 복합 PK (shcode, trade_date) 인덱스 조회 (0.3초 이내, 4.5절)
      const primaryUrl =
        `${DEFAULT_SUPABASE_URL}/rest/v1/daily_investor_supply` +
        `?shcode=in.(005930,000660,005380,012450,196170,006650,023160,218410,166090,009420)` +
        `&or=(real_inst_vol.neq.0,frg_vol.neq.0,ind_vol.neq.0,fn_inv_vol.neq.0)` +
        `&select=shcode,trade_date&order=trade_date.desc&limit=30`;
      const rows = await fetchJsonWithRetry(primaryUrl, headers, 2);
      if (Array.isArray(rows) && rows.length > 0) {
        return rows.reduce((maxDt, r) => (r.trade_date > maxDt ? r.trade_date : maxDt), rows[0].trade_date);
      }
      return "";
    }

    function countSettledUniverseStocks(masters, chartMap, supplyMap, topTradeDate) {
      if (!topTradeDate || !Array.isArray(masters) || masters.length === 0) return 0;
      let settledCount = 0;
      for (let i = 0; i < masters.length; i++) {
        const code = masters[i].shcode;
        const sList = supplyMap ? supplyMap[code] : null;
        const cList = chartMap ? chartMap[code] : null;
        const hasSettledSupplyOnTop =
          Array.isArray(sList) && sList.length > 0 && sList[sList.length - 1].trade_date === topTradeDate;
        const hasHaltedChartOnTop =
          Array.isArray(cList) &&
          cList.length > 0 &&
          cList[cList.length - 1].trade_date === topTradeDate &&
          cList[cList.length - 1].volume !== undefined &&
          cList[cList.length - 1].volume !== null &&
          Number(cList[cList.length - 1].volume) === 0;
        if (hasSettledSupplyOnTop || hasHaltedChartOnTop) {
          settledCount++;
        }
      }
      return settledCount;
    }

    function formatTradeDateBadgeText(topTradeDate, settledCount, totalUniverseCount) {
      if (!topTradeDate) return "기준일 확인 실패";
      if (totalUniverseCount > 0 && (settledCount / totalUniverseCount) < 0.95) {
        return `기준일: ${topTradeDate} (일일 배치 동기화 진행 중: ${settledCount}/${totalUniverseCount}종목)`;
      }
      return `기준일: ${topTradeDate}`;
    }

    async function fetchAllUniverseMasters(headers) {
      const pages = await Promise.all([0, 1, 2].map(page =>
        fetchJsonWithRetry(
          `${DEFAULT_SUPABASE_URL}/rest/v1/stocks_master` +
          `?is_universe=eq.true` +
          `&select=shcode,hname,market,market_cap_eok,avg_val_20d_eok,last_close` +
          `&order=market_cap_eok.desc,shcode.asc&limit=1000&offset=${page * 1000}`,
          headers,
          2
        ).catch(() => [])
      ));
      return pages.flat();
    }

    async function connectSupabaseLive() {
      if (IS_LOADING_DB) return;
      IS_LOADING_DB = true;

      const dateBadge = document.getElementById("lastTradeDateBadge");
      const notice = document.getElementById("dataSourceNotice");
      const noticeText = document.getElementById("dataSourceNoticeText");
      const headers = getSupabaseHeaders();

      notice.classList.add("hidden");
      dateBadge.textContent = "기준일 불러오는 중...";

      try {
        // 1) 최신 확정 기준일(T) 및 1,463종목 마스터 병렬 조회
        const [topTradeDate, masters] = await Promise.all([
          fetchLatestSettledTradeDate(headers),
          fetchAllUniverseMasters(headers)
        ]);

        if (!topTradeDate || !masters.length) {
          throw new Error("DB에 확정된 유니버스 또는 수급 데이터가 아직 없습니다.");
        }

        TOP_TRADE_DATE = topTradeDate;
        MASTERS_LIST = masters;
        MASTER_BY_CODE = {};
        masters.forEach(m => { MASTER_BY_CODE[m.shcode] = m; });

        dateBadge.textContent = `기준일: ${topTradeDate} (데이터 동기화 중...)`;

        // 2) 1,463종목 최근 45일 수급·일봉 윈도우를 청크당 28종목(<=30종목, 최대 ~880행 < 1,000행)씩 PK 인덱스 병렬 로드
        const cutoff45 = computeCutoffDateStr(topTradeDate, 45);
        const allCodes = masters.map(m => m.shcode);
        const chunks = [];
        const CHUNK_SIZE = 28;
        for (let i = 0; i < allCodes.length; i += CHUNK_SIZE) {
          chunks.push(allCodes.slice(i, i + CHUNK_SIZE));
        }

        const chartMap = {};
        const supplyMap = {};
        const totalTasks = chunks.length * 2;

        const combinedTasks = [];
        chunks.forEach(chunk => {
          const inList = chunk.join(",");
          combinedTasks.push(async () => {
            const cUrl =
              `${DEFAULT_SUPABASE_URL}/rest/v1/daily_chart` +
              `?shcode=in.(${inList})` +
              `&and=(trade_date.gte.${cutoff45},trade_date.lte.${topTradeDate})` +
              `&select=${CHART_SELECT_COLS}` +
              `&order=shcode.asc,trade_date.asc&limit=1000`;
            const rows = await fetchJsonWithRetry(cUrl, headers, 2);
            if (Array.isArray(rows)) {
              rows.forEach(r => {
                if (r.trade_date <= topTradeDate) {
                  if (!chartMap[r.shcode]) chartMap[r.shcode] = [];
                  chartMap[r.shcode].push(r);
                }
              });
            }
          });
          combinedTasks.push(async () => {
            const sUrl =
              `${DEFAULT_SUPABASE_URL}/rest/v1/daily_investor_supply` +
              `?shcode=in.(${inList})` +
              `&and=(trade_date.gte.${cutoff45},trade_date.lte.${topTradeDate})` +
              `&select=${SUPPLY_SELECT_COLS}` +
              `&order=shcode.asc,trade_date.asc&limit=1000`;
            const rows = await fetchJsonWithRetry(sUrl, headers, 2);
            if (Array.isArray(rows)) {
              rows.forEach(r => {
                if (r.trade_date < topTradeDate || (r.trade_date === topTradeDate && isSettledSupplyRow(r))) {
                  if (!supplyMap[r.shcode]) supplyMap[r.shcode] = [];
                  supplyMap[r.shcode].push(r);
                }
              });
            }
          });
        });

        await runWithConcurrency(combinedTasks, 8, (done) => {
          const pct = Math.min(99, Math.round((done / totalTasks) * 100));
          dateBadge.textContent = `기준일: ${topTradeDate} (동기화 ${pct}%)`;
        });

        Object.keys(chartMap).forEach(code => {
          chartMap[code] = mergeSortedByTradeDate([], chartMap[code], topTradeDate);
        });
        Object.keys(supplyMap).forEach(code => {
          supplyMap[code] = mergeSortedByTradeDate([], supplyMap[code], topTradeDate);
        });

        RAW_CHARTS_BY_CODE = chartMap;
        RAW_SUPPLIES_BY_CODE = supplyMap;
        REVERSAL_HISTORY_LOADED = {};
        FULL_CHART_LOADED = {};
        IS_LIVE_SUPABASE = true;

        // 3) [하락 추세 전환 수급 발생] 1차 후보 종목들의 125일 일봉 히스토리 사전 보강 로드 (10종목 이하 청크)
        await ensureReversalCandidatesHistory();

        const settledCount = countSettledUniverseStocks(masters, chartMap, supplyMap, topTradeDate);
        dateBadge.textContent = formatTradeDateBadgeText(topTradeDate, settledCount, masters.length);
        notice.classList.add("hidden");
      } catch (err) {
        console.error("Supabase 데이터 로드 실패:", err);
        IS_LIVE_SUPABASE = false;
        dateBadge.textContent = "기준일 확인 실패";
        notice.classList.remove("hidden");
        noticeText.textContent = `데이터베이스 조회 중 오류가 발생했습니다 (${err.message || err}). 우측 버튼을 눌러 다시 시도해 주세요.`;
      } finally {
        IS_LOADING_DB = false;
      }

      applyScreening();
    }

    window.addEventListener("DOMContentLoaded", () => {
      connectSupabaseLive();
    });
  </script>
